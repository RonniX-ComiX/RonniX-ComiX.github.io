<!DOCTYPE html>
<html lang="de" class="scroll-smooth overflow-x-clip">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO (statische Hülle; React/Helmet verfeinert je Route/Domain/Sprache) -->
    <title>Comics, Bücher, Games & Filme – RonniX Entertainment</title>
    <meta name="description" content="RonniX Entertainment: handgemachte Comics, spannende Bücher, Indie-Games sowie Film- & Serienkritiken. Tauch ein ins Universum!">
    <meta name="author" content="RonniX Entertainment">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="language" content="German">

    <!-- Domains & Canonicals: Hostname-scharf per externem Skript (1 Build, 6 Domains).
         Ohne JS greift der Main-Fallback; mit JS (auch ohne React-Hydration)
         zeigt der Canonical auf die echte Domain. React/Helmet überschreibt danach.
         Extern statt inline, weil die CSP Inline-Scripts blockt (`script-src 'self'`). -->
    <link id="static-canonical" rel="canonical" href="https://ronnixentertainment.de/" />
    <link rel="alternate" hreflang="de" href="https://ronnixentertainment.de/" />
    <link rel="alternate" hreflang="x-default" href="https://ronnixentertainment.de/" />
    <script src="/canonical.js" defer></script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ronnixentertainment.de/">
    <meta property="og:title" content="Comics, Bücher, Games & Filme – RonniX Entertainment">
    <meta property="og:description" content="RonniX Entertainment: handgemachte Comics, spannende Bücher, Indie-Games sowie Film- & Serienkritiken. Tauch ein ins Universum!">
    <meta property="og:image" content="https://ronnixentertainment.de/images/preview.png">
    <meta property="og:image:width" content="1730">
    <meta property="og:image:height" content="909">
    <meta property="og:image:alt" content="RonniX Entertainment – Preview">
    <meta property="og:locale" content="de_DE">
    <meta property="og:locale:alternate" content="en_US">
    <meta property="og:site_name" content="RonniX Entertainment">

    <!-- Twitter (offizielle `name`-Attribute) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Comics, Bücher, Games & Filme – RonniX Entertainment">
    <meta name="twitter:description" content="RonniX Entertainment: handgemachte Comics, spannende Bücher, Indie-Games sowie Film- & Serienkritiken. Tauch ein ins Universum!">
    <meta name="twitter:image" content="https://ronnixentertainment.de/images/preview.png">
    <meta name="twitter:image:alt" content="RonniX Entertainment – Preview">
    <meta name="twitter:site" content="@RonniXComiX">

    <!-- Favicons (Expects files in favicons subfolder) -->
    <link rel="apple-touch-icon" sizes="180x180" href="./favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicons/favicon-16x16.png">
    <link rel="manifest" href="./favicons/site.webmanifest">
    <link rel="mask-icon" href="./favicons/safari-pinned-tab.svg" color="#dc2626">
    <meta name="msapplication-TileColor" content="#000000">
    <meta name="theme-color" content="#0a0a0a">

    <!-- Performance & Security Hints (kein Google-Fonts-CDN mehr: Fonts sind selbst gehostet) -->
    <!-- Preconnect-Diät (PageSpeed: max. 4): nur API-kritische Origins; SSO-Ziele per dns-prefetch -->
    <link rel="preconnect" href="https://europe-west1-ronnix-comix.cloudfunctions.net">
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <link rel="dns-prefetch" href="https://ronnixcomix.de">
    <link rel="dns-prefetch" href="https://ronnixboox.de">
    <link rel="dns-prefetch" href="https://lamazgamez.de">
    <link rel="dns-prefetch" href="https://ronnixmoviez.de">
    <link rel="dns-prefetch" href="https://ronnixseriez.de">
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com">
    <link rel="dns-prefetch" href="https://securetoken.googleapis.com">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <!-- DEV_ONLY_START -->
    <!-- 
      HYBRID MODE: Tailwind CDN
      Diese Skripte werden vom 'remove-dev-scripts' Plugin in vite.config.ts 
      automatisch entfernt, wenn 'npm run build' ausgeführt wird.
    -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              red: {
                600: '#dc2626',
                700: '#b91c1c',
                800: '#991b1b',
                900: '#7f1d1d',
              }
            },
            fontFamily: {
              'retro': ['Bangers', 'Bangers-fb', 'Arial Black', 'Impact', 'sans-serif'],
              'gaming': ['"Press Start 2P"', 'PS2P-fb', '"Courier New"', 'monospace'],
              'sans': ['Roboto', 'Roboto-fb', 'Arial', 'sans-serif'],
              'serif': ['Georgia', 'serif'],
            },
            animation: {
              'fade-in': 'fadeIn 1s ease-out',
              'slide-up': 'slideUp 0.8s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <!-- DEV_ONLY_END -->

    <!-- Fonts: selbst gehostet (public/fonts/), kein Google-CDN zur Laufzeit.
         Preload der kritischen Schnitte (Navbar/Body), damit der First Paint
         direkt mit Marken-Fonts malt statt zu swappen. Metrisch angepasste
         local()-Fallbacks in index.css fangen den Rest ohne Shift ab. -->
    <link rel="preload" href="/fonts/bangers-latin-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/roboto-latin-var.woff2" as="font" type="font/woff2" crossorigin>
    <!-- LCP: Hero-WebP früh entdecken (Quellenauswahl bleibt beim Browser via srcset) -->
    <link rel="preload" as="image" href="/images/RonniX-1024.webp" imagesrcset="/images/RonniX-640.webp 640w, /images/RonniX-1024.webp 1024w, /images/RonniX-1600.webp 1600w" imagesizes="(max-width: 640px) 100vw, (max-width: 1024px) 90vw, 896px" fetchpriority="high">
    
    <style>
      /* CRITICAL CSS: Prevent White Flash (Inline for instant load) */
      html, body {
        background-color: #0a0a0a; /* neutral-950 */
        color: white;
      }
      
      /* Initial Loader (Pure CSS) displayed before React Hydration */
      .initial-loader {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: #0a0a0a;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }
      .initial-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(220, 38, 38, 0.3);
        border-radius: 50%;
        border-top-color: #dc2626;
        animation: spin 1s ease-in-out infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      /* Restliche Styles wurden in index.css verschoben für den Build-Prozess */
    </style>
</head>
  <body class="bg-neutral-950 text-white min-h-[100dvh] overflow-x-clip">
    <div id="root">
        <!-- Visible while React Loads -->
        <div class="initial-loader">
            <div class="initial-spinner"></div>
        </div>
    </div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
