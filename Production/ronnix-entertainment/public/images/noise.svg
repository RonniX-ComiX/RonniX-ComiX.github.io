<!-- noise.svg — selbst gehostete Filmkorn-Textur (feTurbulence, kein Drittanbieter).
     Ersatz für den toten grainy-gradients-Hotlink (Deployment 404).
     Deckkraft steuert das jeweilige Element per CSS (z. B. opacity-20 im Hero). -->
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
  <filter id="n">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#n)"/>
</svg>
